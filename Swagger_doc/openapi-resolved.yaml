openapi: 3.0.0                     # Version OpenAPI
info:
  title: Argent Bank Transactions API     # Titre de l'API
  description: API pour la gestion des transactions d’un utilisateur authentifié  # résumé
  version: 1.0.0                  # Version de ton API
servers:
- url: http://localhost:3001/api/v1    # URL de base du serveur

security:
- bearerAuth: []                 # token JWT requis

paths:                           # toutes les routes de l’API listées après "paths:"

  /transactions/{accountId}:     # Route pour lister toutes les transactions d’un compte
    get:
      summary: Liste des transactions du mois en cours pour un compte
      parameters:                # paramètre de route (obligatoire)
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          example: checking      # Exemple de valeur (checking, savings, etc)
      responses:
        "200":
          description: Liste des transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"  # format d’1 transaction
        "401":
          description: Non autorisé (JWT manquant ou invalide)
        "404":
          description: Compte non trouvé
      security:
      - bearerAuth: []

  /transactions/{accountId}/{transactionId}:
    get:
      summary: Détail d'une transaction spécifique
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: transactionId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Détails de la transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401":
          description: Non autorisé
        "404":
          description: Transaction non trouvée
      security:
      - bearerAuth: []

    patch:
      summary: Modifier ou supprimer les informations personnalisées d'une transaction
      description: Modifie les champs `note` et/ou `category` d’une transaction, ou les supprime si `delete` vaut `true`.
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
      - name: transactionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPatchRequest"
      responses:
        "200":
          description: Modification ou suppression effectuée
        "400":
          description: Requête invalide
        "401":
          description: Non autorisé
        "404":
          description: Transaction non trouvée
      security:
      - bearerAuth: []


components:
  schemas:

    Transaction:
      type: object
      properties:
        id:
          type: string
          example: txn_123456
        accountId:
          type: string
          example: checking
        date:
          type: string
          format: date
          example: 2025-07-01
        description:
          type: string
          example: Golden Sun Bakery
        amount:
          type: number
          format: float
          example: 8
        balance:
          type: number
          format: float
          example: 298
        type:
          type: string
          example: Electronic
        category:
          type: string
          example: Food
        note:
          type: string
          example: Petit déjeuner

    TransactionPatchRequest:
      type: object
      description: Les champs à modifier ou à supprimer
      properties:
        category:
          type: string
          example: Transport
        note:
          type: string
          example: Ticket métro
        delete:
          type: boolean
          example: false

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
